version: 2
sources:
  - name: ecommerce
    database: RAW
    schema: ECOMMERCE
    tables:
      - name: customers
      - name: orders
        config: 
          loaded_at_field: updated_at
          freshness: 
            warn_after: 
              count: 24
              period: hour
            error_after: 
              count: 72
              period: hour
            
        
      - name: order_items  
      - name: payments
        config: 
          loaded_at_field: paid_at
          freshness: 
            warn_after: 
              count: 24
              period: hour
            error_after: 
               count: 72
               period: hour
              
            



